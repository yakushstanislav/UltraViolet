#
# Example reverse-proxy config for fronting UltraViolet with HTTPS.
#
# Deployment shape:
#   browser ──HTTPS──> nginx (this file) ──HTTP──> uv-frontend:8080 (compose)
#                                                  uv-frontend already proxies
#                                                  /api → uv-api:8080 and
#                                                  /realtime → uv-api:8081
#                                                  inside the compose network.
#
# Place uv-frontend on the host loopback (e.g. compose ports: 127.0.0.1:3000:8080)
# so it is never reachable from the public network without TLS termination.
#
# Required:
#   - DNS A/AAAA for ${SERVER_NAME} pointing at this host
#   - certbot / acme.sh certificate for ${SERVER_NAME}
#   - AUDIT_TRUST_PROXY_HEADERS=true in service-env/.env so uv-api records
#     X-Forwarded-For instead of the proxy IP in audit logs and rate-limit
#     buckets.

upstream uv_frontend {
    server 127.0.0.1:3000;
    keepalive 8;
}

# Redirect plain HTTP → HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name ultraviolet.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ultraviolet.example.com;

    ssl_certificate     /etc/letsencrypt/live/ultraviolet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ultraviolet.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:UV-TLS:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "DENY"                                 always;
    add_header Referrer-Policy           "no-referrer"                          always;

    # Cap upload sizes; UltraViolet has no large-body endpoints.
    client_max_body_size 2m;

    # WebSocket lives under /realtime/ — needs Upgrade + long read timeout.
    location /realtime/ {
        proxy_pass http://uv_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://uv_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
