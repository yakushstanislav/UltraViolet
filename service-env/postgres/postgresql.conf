# UltraViolet PostgreSQL tuning — 8 GB RAM, NVMe SSD, all connections via PgBouncer.
# Mounted read-only; postgres starts with: postgres -c config_file=/etc/postgresql/postgresql.conf

# ── Memory ──────────────────────────────────────────────────────────────────
# shared_buffers: 25 % of RAM. PostgreSQL's own buffer pool; raise first.
shared_buffers = 2GB

# effective_cache_size: 75 % of RAM. Hints to the planner how much the OS
# page cache can hold — does not allocate memory, only guides plan choices.
effective_cache_size = 6GB

# work_mem: per sort / hash operation. Multiplied by max_parallel_workers_per_gather
# for parallel queries and by the number of concurrent sessions. Keep conservative
# on 8 GB; raise to 32 MB if long sorts spill to disk in EXPLAIN ANALYZE.
work_mem = 16MB

# maintenance_work_mem: VACUUM, CREATE INDEX, CLUSTER. At 50 M hosts, index
# builds and autovacuum benefit from a larger sort buffer.
maintenance_work_mem = 512MB

# ── WAL ─────────────────────────────────────────────────────────────────────
wal_buffers = 16MB

# Allow up to 4 GB of WAL between checkpoints on a scan-heavy write burst.
max_wal_size = 4GB
min_wal_size = 512MB

# Spread checkpoint I/O over 90 % of the checkpoint interval to avoid
# write spikes that stall the scanner's ingest transactions.
checkpoint_completion_target = 0.9

# ── Planner / I/O ───────────────────────────────────────────────────────────
# NVMe random read cost ≈ sequential read cost.  Without this the planner
# over-prefers sequential scans on large tables (uv_service, uv_host).
random_page_cost = 1.1
seq_page_cost = 1.0

# Enables parallel bitmap heap scan and prefetching on NVMe.
effective_io_concurrency = 200

# ── Parallelism ──────────────────────────────────────────────────────────────
# Conservative for 8 GB.  Dashboard aggregates and index builds use up to
# max_parallel_workers_per_gather × work_mem each.
max_worker_processes            = 8
max_parallel_workers            = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ── Statistics ──────────────────────────────────────────────────────────────
# Default 100 produces poor estimates on the 500 M-row uv_service table.
# 200 samples more of the column distribution; negligible extra ANALYZE time.
default_statistics_target = 200

# ── JIT ─────────────────────────────────────────────────────────────────────
# JIT helps long OLAP queries; it adds overhead on the short OLTP queries
# that dominate the scanner ingest path (INSERT, UPDATE last_seen, CVE match).
jit = off

# ── Connections ─────────────────────────────────────────────────────────────
# Required when config_file is mounted: without this Postgres defaults to
# localhost-only and pgbouncer/uv-api in other containers cannot connect.
listen_addresses = '*'
port = 5432

# All application connections arrive through PgBouncer (transaction mode,
# pool size 40).  Keep max_connections low — each idle backend costs ~5 MB
# of shared memory and a process slot.
max_connections = 100

# ── Autovacuum ──────────────────────────────────────────────────────────────
# At default scale_factor=0.2 autovacuum does not trigger until 10 M dead
# tuples accumulate on a 50 M-row table.  Lower thresholds prevent bloat.
autovacuum_vacuum_scale_factor   = 0.01
autovacuum_analyze_scale_factor  = 0.005

# Aggressive I/O budget on NVMe.  Default cost_delay=20ms, cost_limit=200
# throttles autovacuum so severely that it cannot keep up with scanner writes.
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 800

# 4 autovacuum workers: one per hot table (uv_host, uv_service,
# uv_service_snapshot, uv_service_change_event) running concurrently.
autovacuum_max_workers = 4

# ── Logging (minimal; structured logs come from the application layer) ───────
log_min_duration_statement = 2000
log_checkpoints = on
