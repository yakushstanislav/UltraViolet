name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: service-api/go.mod
          cache-dependency-path: service-api/go.sum

      - name: Test
        working-directory: service-api
        run: GOCACHE=/tmp/uv-go-build go test ./...

      - name: Vet
        working-directory: service-api
        run: GOCACHE=/tmp/uv-go-build go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: service-api

      - name: govulncheck
        working-directory: service-api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build binaries
        run: make build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service-frontend/package-lock.json

      - name: Install dependencies
        working-directory: service-frontend
        run: npm ci

      - name: Lint
        working-directory: service-frontend
        run: npm run lint

      - name: Format check
        working-directory: service-frontend
        run: npm run format:check

      - name: npm audit (high+critical)
        working-directory: service-frontend
        run: npm audit --audit-level=high --omit=dev

      - name: Build
        working-directory: service-frontend
        run: npm run build

      - name: Bundle size budget
        working-directory: service-frontend
        run: npm run build:check-size

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: service-documentation-frontend
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: service-documentation-frontend
        run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate production compose (no build blocks)
        working-directory: service-env
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          if docker compose -f docker-compose.yml config 2>/dev/null | grep -E '^[[:space:]]+build:'; then
            echo "Production docker-compose.yml must not contain build: blocks" >&2
            exit 1
          fi
